<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%">
  <defs>
    <!-- Gradient for Brand Accent -->
    <linearGradient id="pReplayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Replay Emblem (Angled Cut Mask & Forward Triangle) -->
  <g transform="translate(10, 15)">
    <!-- Outer Angled Diamond -->
    <polygon points="40,0 80,40 40,80 0,40" fill="url(#pReplayGrad)" filter="url(#glow)"/>
    <polygon points="40,6 74,40 40,74 6,40" fill="#0c0c14" />
    
    <!-- Inner Replay Arrow Symbol -->
    <path d="M 28,26 L 56,40 L 28,54 Z" fill="#ffffff" />
    <path d="M 46,26 L 56,40 L 46,54" stroke="url(#pReplayGrad)" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography: PERSONA -->
  <text x="110" y="52" 
        font-family="'Cinzel', 'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="38" 
        font-weight="900" 
        font-style="italic"
        letter-spacing="4" 
        fill="#ffffff">
    PERSONA
  </text>

  <!-- Typography: REPLAY -->
  <text x="112" y="86" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="24" 
        font-weight="900" 
        font-style="italic"
        letter-spacing="8" 
        fill="url(#pReplayGrad)">
    REPLAY
  </text>

  <!-- Subtitle Tag -->
  <text x="270" y="86" 
        font-family="'JetBrains Mono', monospace" 
        font-size="11" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#94a3b8">
    // THE DEFINITIVE STORE
  </text>
</svg>
